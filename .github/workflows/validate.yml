name: Validate ALVOS
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate HTML structure
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re
          s=Path("index.html").read_text(encoding="utf-8")
          assert s.lower().startswith("<!doctype html>")
          assert s.count("<script>")==1 and s.count("</script>")==1
          ids=re.findall(r'\bid="([^"]+)"',s)
          dup=sorted({x for x in ids if ids.count(x)>1})
          assert not dup, f"duplicate ids: {dup}"
          js=re.search(r"<script>(.*?)</script>",s,re.S).group(1)
          Path("/tmp/alvos-app.js").write_text(js,encoding="utf-8")
          print("HTML checks passed")
          PY
      - name: Validate JavaScript syntax
        run: node --check /tmp/alvos-app.js
      - name: Validate service worker
        run: node --check sw.js
      - name: Validate PWA files
        run: |
          test -f manifest.webmanifest
          test -f icon.svg
          grep -q '"start_url"' manifest.webmanifest
          grep -q 'serviceWorker.register' index.html
